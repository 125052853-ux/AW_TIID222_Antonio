<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen</title>
</head>
<body>
    <div class="Examen">
        <header class="encabezado" style="display: flex; background-color: rgb(127, 255, 127);">
            <div class="aplicaciones" style="text-align: center;">
                <h1 style="text-align: center;">EXAMEN 1ER PARCIAL - APLICACIONES WEB</h1>
            </div>
    </div>
        </header>
         <main class="contenido" style="display: grid; grid-template-columns: 50% 50%;">
            <div class="columna-formulario" style="background-color: darkolivegreen;">
                <div class="formulario">
                <H2>FORMULARIO</H2>
                <UL>
                    <LI>Escoba</LI>
                    <LI>Mate</LI>
                    <LI>3</LI>
                    <LI>$300</LI>
                </UL>
                </div>
            </div>

            <div class="columna-tabla" style="text-align: center;">
                <h1>TABLA DE PRODUCTOS</h1>
                <table border="2" style="text-align: center;">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>NOMBRE</th>
                            <th>MARCA</th>
                            <th>STOCK</th>
                            <th>PRECIO</th>
                        </tr>
                    </thead>
                        
                </table>
            </div>
         </main>
</body>
</html>
