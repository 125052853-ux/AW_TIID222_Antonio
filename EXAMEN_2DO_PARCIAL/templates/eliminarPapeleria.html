<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Producto</title>
</head>
<body>
    <div>
        <h1>Producto a eliminar</h1>
        <form action="/eliminar/{{Papeleria.0}}" method="POST">
            <input type="text" name="txtNombre" value="{{Papeleria.1}}" readonly>
            <input type="text" name="txtDescripcion" value="{{Papeleria.2}}" readonly>
            <input type="text" name="txtCosto" value="{{Papeleria.3}}" readonly>
            <input type="text" name="txtStock" value="{{Papeleria.4}}" readonly>
            
            <button type="submit" onclick="return Eliminar()">Eliminar</button>
            <button type="button" onclick="Regresar()">Regresar</button>
        </form>

        <script>
            function Eliminar(){
                return confirm("¿Estás seguro de que deseas eliminar este producto?");
            }
            function Regresar(){
                window.location.href = "{{ url_for('index') }}";
            }
        </script>
    </div>
</body>
</html>
